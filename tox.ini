[tox]
isolated_build = true
skipsdist = true
usedevelop = true

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE = tests.test_settingsAA4
deps=
    allianceauth @ git+https://gitlab.com/allianceauth/allianceauth.git
    bravado
    coverage

install_command = pip install -e ".[test]" -U {opts} {packages}

allowlist_externals = bash

commands=
    coverage run -m pytest --md-report --md-report-flavor github --md-report-exclude-outcomes passed --md-report-verbose=1 --md-report-output=test-summary.md
    pip list
    coverage xml
    coverage html
    coverage report -m
