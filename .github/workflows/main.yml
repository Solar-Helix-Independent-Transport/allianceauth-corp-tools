# This is a basic workflow to help you get started with Actions
name: CI

# Controls when the workflow will run
on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - "**"
    tags-ignore:
      - "**"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: "latest"

      - run: redis-cli ping

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: install dependencies
        run: make dev

      - name: Run Tests
        run: make test

      - name: Add test summary
        if: ${{ !env.ACT }}
        run: |
          echo "### Test Report (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          cat test-summary.md >> "$GITHUB_STEP_SUMMARY"
          # echo "### Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          # cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test coverage
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          # Artifact name
          name: Python${{ matrix.python-version }} Test Coverage
          # A file, directory or wildcard pattern that describes what to upload
          path: htmlcov/

  js-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: install dependencies
        run: cd frontend && npm ci

      - name: Run JS Tests
        run: cd frontend && npm test

  build:
    needs: [python-test, js-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: install dependencies
        run: make dev

      - name: Build JS
        run: make buildjs

      - name: Build Python
        run: make package
